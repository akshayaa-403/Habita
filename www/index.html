<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Habita — a visual Eisenhower Matrix task manager that blocks time for your tasks in your phone's own calendar.">
  <meta name="theme-color" content="#f5f3f0">
  <meta name="color-scheme" content="light dark">
  <title>Habita – Eisenhower Matrix</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Dark Mode Toggle -->
  <button type="button" class="dark-mode-toggle" id="darkModeToggle"
          title="Toggle dark/light mode" aria-label="Toggle dark mode" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
  </button>

  <!-- Matrix View -->
  <div class="matrix-view" id="matrixView">
    <div class="matrix-grid" id="matrixGrid">
      <!-- Axis Labels -->
      <div class="axis-horizontal-top" aria-hidden="true">Important</div>
      <div class="axis-horizontal-bottom" aria-hidden="true">Not Important</div>

      <!-- Quadrant 1: Focus (Urgent & Important) -->
      <div class="quadrant q1" data-quadrant="1" role="button" tabindex="0"
           aria-label="Focus — urgent and important tasks">
        <span class="quadrant-label">Focus</span>
        <div class="progress-container" id="progress1"></div>
      </div>

      <!-- Quadrant 2: Backburner (Not Urgent & Important) -->
      <div class="quadrant q2" data-quadrant="2" role="button" tabindex="0"
           aria-label="Backburner — not urgent but important tasks">
        <span class="quadrant-label">Backburner</span>
        <div class="progress-container" id="progress2"></div>
      </div>

      <!-- Quadrant 3: Fit In (Urgent & Not Important) -->
      <div class="quadrant q3" data-quadrant="3" role="button" tabindex="0"
           aria-label="Fit In — urgent but not important tasks">
        <span class="quadrant-label">Fit In</span>
        <div class="progress-container" id="progress3"></div>
      </div>

      <!-- Quadrant 4: Goals (Not Urgent & Not Important) -->
      <div class="quadrant q4" data-quadrant="4" role="button" tabindex="0"
           aria-label="Goals — not urgent and not important tasks">
        <span class="quadrant-label">Goals</span>
        <div class="progress-container" id="progress4"></div>
      </div>

      <!-- Center draggable plus button: drag onto a quadrant to quick-add a task -->
      <div class="plus-button" id="plusButton" title="Drag onto a quadrant to add a task" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </div>
    </div>
  </div>

  <!-- Day Timeline View -->
  <div class="timeline-view" id="timelineView" hidden>
    <div class="timeline-header">
      <div class="day-nav">
        <button type="button" class="nav-btn" id="prevDayBtn" aria-label="Previous day">‹</button>
        <div class="day-heading">
          <span class="day-label" id="dayLabel"></span>
          <span class="day-date" id="dayDate"></span>
        </div>
        <button type="button" class="nav-btn" id="nextDayBtn" aria-label="Next day">›</button>
        <button type="button" class="today-btn" id="todayBtn">Today</button>
      </div>
      <button type="button" class="calendar-status" id="calendarStatus"
              title="Calendar connection — tap to connect or pause syncing"></button>
    </div>

    <!-- Unscheduled tasks: drag one onto the day, or tap to auto-place it -->
    <div class="tray-wrapper">
      <div class="tray-head">
        <span class="tray-title">Waiting</span>
        <span class="tray-count" id="trayCount"></span>
      </div>
      <div class="timeline-tray" id="timelineTray"></div>
    </div>

    <div class="timeline-scroller" id="timelineScroller">
      <div class="timeline-grid" id="timelineGrid">
        <div class="hour-lines" id="hourLines"></div>
        <!-- Existing phone-calendar events, read-only, in their own lane -->
        <div class="device-events-lane" id="deviceEventsLane"></div>
        <!-- Habita task blocks: draggable and resizable -->
        <div class="task-blocks-lane" id="taskBlocksLane"></div>
        <div class="now-line" id="nowLine" hidden><span class="now-dot"></span></div>
      </div>
      <p class="timeline-empty-hint" id="timelineEmptyHint">
        Drag a task from <strong>Waiting</strong> onto the hours above to block out time for it.
        Drag a block to move it, or pull its bottom edge to change how long it takes.
      </p>
    </div>
  </div>

  <!-- Task List Page -->
  <div class="task-list-page" id="taskListPage">
    <div class="task-list-header">
      <button type="button" class="back-btn" id="backBtn" aria-label="Back to matrix">←</button>
      <div class="task-list-title" id="taskListTitle"></div>
      <div class="task-count-badge" id="taskCountBadge"></div>
    </div>
    <div class="task-items" id="taskItemsContainer"></div>
    <button class="add-task-btn" id="addTaskBtn">+ Add Task</button>
  </div>

  <!-- Bottom navigation between the matrix and the day timeline -->
  <nav class="bottom-nav" id="bottomNav" aria-label="Views">
    <button type="button" class="nav-tab active" data-view="matrix" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>
      <span>Matrix</span>
    </button>
    <button type="button" class="nav-tab" data-view="timeline">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zm12 8v10H5V10h14zM7 12h5v4H7v-4z"/></svg>
      <span>Day</span>
    </button>
  </nav>

  <!-- Floating time read-out shown while dragging a block -->
  <div class="drag-tooltip" id="dragTooltip" hidden></div>

  <!-- Splash overlay container -->
  <div class="splash-overlay" id="splashOverlay"></div>

  <script src="js/storage.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
