<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habita – Eisenhower Matrix</title>
  <style>
    /* ========== CSS Variables & Base ========== */
    :root {
      --bg: #f5f3f0;
      --surface: #ffffff;
      --text: #2d2d2d;
      --text-secondary: #555;
      --shadow: 0 8px 30px rgba(0,0,0,0.08);
      --border: rgba(0,0,0,0.06);
      --btn-bg: #fff;
      --btn-hover: #f0f0f0;
      --overlay: rgba(0,0,0,0.5);

      /* Quadrant pastel colors (light) */
      --q1: #f9c6c6;  /* pastel red */
      --q2: #c6e5c6;  /* pastel green */
      --q3: #fdf0b0;  /* pastel yellow */
      --q4: #b3d4f0;  /* pastel blue */

      --q1-text: #a33;
      --q2-text: #285e28;
      --q3-text: #8b7d1a;
      --q4-text: #1d5280;

      /* Task list page light background (even lighter) */
      --q1-light: #fde8e8;
      --q2-light: #e6f5e6;
      --q3-light: #fefae0;
      --q4-light: #d8eaf8;

      transition: background 0.3s, color 0.3s;
    }

    body.dark-mode {
      --bg: #1a1a1a;
      --surface: #2b2b2b;
      --text: #eaeaea;
      --text-secondary: #aaa;
      --shadow: 0 8px 30px rgba(0,0,0,0.4);
      --border: rgba(255,255,255,0.08);
      --btn-bg: #3a3a3a;
      --btn-hover: #4a4a4a;
      --overlay: rgba(0,0,0,0.7);

      --q1: #b74e4e;
      --q2: #4e7a4e;
      --q3: #b8a84e;
      --q4: #4e6e9a;

      --q1-light: #5c3232;
      --q2-light: #2d422d;
      --q3-light: #4b4428;
      --q4-light: #283b4f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      user-select: none;
      display: flex;
      flex-direction: column;
      transition: background 0.3s, color 0.3s;
    }

    /* ========== Dark Mode Toggle ========== */
    .dark-mode-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: background 0.2s;
    }
    .dark-mode-toggle:hover { background: var(--btn-hover); }
    .dark-mode-toggle svg { width: 24px; height: 24px; fill: var(--text); }

    /* ========== Main Matrix Container ========== */
    .matrix-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .matrix-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      position: relative;
    }

    .quadrant {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
      overflow: hidden;
    }
    .quadrant:hover { filter: brightness(0.97); }
    .quadrant:active { transform: scale(0.98); }

    /* Quadrant backgrounds */
    .q1 { background: var(--q1); }
    .q2 { background: var(--q2); }
    .q3 { background: var(--q3); }
    .q4 { background: var(--q4); }

    /* Labels (optional subtle text) */
    .quadrant-label {
      position: absolute;
      bottom: 12px;
      left: 12px;
      font-size: 0.8rem;
      opacity: 0.8;
      font-weight: 500;
      color: var(--q1-text);
    }
    .q2 .quadrant-label { color: var(--q2-text); }
    .q3 .quadrant-label { color: var(--q3-text); }
    .q4 .quadrant-label { color: var(--q4-text); }

    /* Progress Ring inside each quadrant */
    .progress-container {
      position: relative;
      width: 80px;
      height: 80px;
    }
    .progress-ring {
      transform: rotate(-90deg);
      width: 80px;
      height: 80px;
    }
    .progress-ring-bg {
      fill: none;
      stroke: rgba(255,255,255,0.5);
      stroke-width: 6;
    }
    .progress-ring-fill {
      fill: none;
      stroke: var(--text);
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.6s ease;
    }
    .remaining-number {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
    }
    .total-text {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      opacity: 0.7;
      color: var(--text);
    }

    /* ========== Central Plus Button ========== */
    .plus-button {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 64px;
      height: 64px;
      background: var(--surface);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      cursor: grab;
      z-index: 20;
      transition: box-shadow 0.2s, transform 0.1s;
      user-select: none;
      border: 2px solid var(--border);
    }
    .plus-button:active { cursor: grabbing; }
    .plus-button.dragging {
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
      transform: translate(-50%, -50%) scale(1.1);
      transition: none;
    }
    .plus-button svg {
      width: 36px;
      height: 36px;
      fill: var(--text);
    }

    /* ========== Task List Page (initially hidden) ========== */
    .task-list-page {
      display: none;
      flex-direction: column;
      height: 100vh;
      background: var(--surface);
      padding: 20px;
      animation: fadeSlideIn 0.3s ease;
    }
    .task-list-page.active {
      display: flex;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task-list-header {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: var(--text);
      margin-right: 16px;
      padding: 8px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .back-btn:hover { background: var(--btn-hover); }
    .task-list-title {
      font-size: 1.8rem;
      font-weight: 600;
      flex: 1;
    }
    .task-count-badge {
      background: var(--border);
      border-radius: 12px;
      padding: 4px 12px;
      font-size: 0.9rem;
    }

    .task-items {
      flex: 1;
      overflow-y: auto;
      padding-right: 8px;
    }
    .task-item {
      display: flex;
      align-items: center;
      padding: 12px 8px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      transition: background 0.2s;
      border-radius: 8px;
      margin-bottom: 4px;
    }
    .task-item.drag-over {
      background: var(--btn-hover);
      outline: 2px dashed var(--text-secondary);
    }
    .drag-handle {
      display: flex;
      flex-direction: column;
      gap: 3px;
      cursor: grab;
      padding: 4px;
      margin-right: 8px;
      color: #999;
    }
    .drag-handle:active { cursor: grabbing; }
    .dot-row {
      display: flex;
      gap: 3px;
    }
    .dot {
      width: 5px;
      height: 5px;
      background: #aaa;
      border-radius: 50%;
    }

    .task-checkbox {
      appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid var(--text-secondary);
      border-radius: 6px;
      margin-right: 12px;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .task-checkbox:checked {
      background: var(--text);
      border-color: var(--text);
    }
    .task-checkbox:checked::after {
      content: '✓';
      color: var(--surface);
      font-size: 16px;
      font-weight: bold;
    }

    .task-text {
      flex: 1;
      font-size: 1rem;
      word-break: break-word;
      cursor: default;
    }
    .task-text.completed {
      text-decoration: line-through;
      opacity: 0.5;
    }
    .task-text[contenteditable="true"] {
      outline: none;
      border-bottom: 2px dashed var(--text-secondary);
      cursor: text;
      background: var(--btn-hover);
      border-radius: 4px;
      padding: 2px 4px;
    }

    .add-task-btn {
      margin-top: 16px;
      padding: 12px;
      background: var(--btn-bg);
      border: 2px dashed var(--border);
      border-radius: 10px;
      color: var(--text-secondary);
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .add-task-btn:hover { background: var(--btn-hover); }

    /* ========== Splash Animation ========== */
    .splash-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-circle {
      width: 0;
      height: 0;
      border-radius: 50%;
      animation: splashAnim 0.5s ease-out forwards;
    }
    @keyframes splashAnim {
      0% { width: 0; height: 0; opacity: 0.8; }
      100% { width: 200vmax; height: 200vmax; opacity: 0; }
    }

    /* ========== Tutorial Overlay ========== */
    .tutorial-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--overlay);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .tutorial-overlay.active { display: flex; }
    .tutorial-box {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      max-width: 320px;
      text-align: center;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .tutorial-step {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }
    .tutorial-text {
      font-size: 1.2rem;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .tutorial-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .tutorial-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      background: var(--btn-bg);
      color: var(--text);
      transition: background 0.2s;
    }
    .tutorial-btn:hover { background: var(--btn-hover); }
    .tutorial-btn.primary {
      background: var(--text);
      color: var(--surface);
    }
    /* Dotted arrow (simplified with CSS) */
    .arrow-dot {
      position: absolute;
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      opacity: 0.9;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.4); opacity: 0.5; }
    }

    /* Scrollbar styling */
    .task-items::-webkit-scrollbar { width: 6px; }
    .task-items::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Responsive: keep the plus button centered correctly */
    @media (max-width: 600px) {
      .progress-container { width: 60px; height: 60px; }
      .progress-ring { width: 60px; height: 60px; }
      .remaining-number { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <!-- Dark Mode Toggle -->
  <div class="dark-mode-toggle" id="darkModeToggle" title="Toggle dark/light mode">
    <svg id="darkIcon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
  </div>

  <!-- Matrix View -->
  <div class="matrix-view" id="matrixView">
    <div class="matrix-grid" id="matrixGrid">
      <div class="quadrant q1" data-quadrant="1">
        <span class="quadrant-label">Urgent & High</span>
        <div class="progress-container" id="progress1"></div>
      </div>
      <div class="quadrant q2" data-quadrant="2">
        <span class="quadrant-label">Not Urgent & High</span>
        <div class="progress-container" id="progress2"></div>
      </div>
      <div class="quadrant q3" data-quadrant="3">
        <span class="quadrant-label">Urgent & Low</span>
        <div class="progress-container" id="progress3"></div>
      </div>
      <div class="quadrant q4" data-quadrant="4">
        <span class="quadrant-label">Not Urgent & Low</span>
        <div class="progress-container" id="progress4"></div>
      </div>
      <!-- Center Plus Button -->
      <div class="plus-button" id="plusButton">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </div>
    </div>
  </div>

  <!-- Task List Page (hidden) -->
  <div class="task-list-page" id="taskListPage">
    <div class="task-list-header">
      <button class="back-btn" id="backBtn">←</button>
      <div class="task-list-title" id="taskListTitle"></div>
      <div class="task-count-badge" id="taskCountBadge"></div>
    </div>
    <div class="task-items" id="taskItemsContainer"></div>
    <button class="add-task-btn" id="addTaskBtn">+ Add Task</button>
  </div>

  <!-- Splash overlay container -->
  <div class="splash-overlay" id="splashOverlay"></div>

  <!-- Tutorial Overlay -->
  <div class="tutorial-overlay" id="tutorialOverlay">
    <div class="tutorial-box" id="tutorialBox">
      <div class="tutorial-step" id="tutorialStepIndicator"></div>
      <div class="tutorial-text" id="tutorialText"></div>
      <div class="tutorial-actions">
        <button class="tutorial-btn" id="tutorialSkipBtn">Skip</button>
        <button class="tutorial-btn primary" id="tutorialNextBtn">Next</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ---------- Data & Storage ----------
      const STORAGE_KEY = 'habita_tasks';
      const TUTORIAL_KEY = 'habita_tutorial_done';
      const DARK_MODE_KEY = 'habita_dark_mode';

      // tasks = { q1: [], q2: [], q3: [], q4: [] }
      let tasks = loadTasks();

      function loadTasks() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          try { return JSON.parse(raw); } catch(e) {}
        }
        return { q1: [], q2: [], q3: [], q4: [] };
      }

      function saveTasks() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      function getTasks(quadrant) {
        return tasks['q' + quadrant] || [];
      }

      function addTask(quadrant, text = '') {
        const list = tasks['q' + quadrant];
        const newTask = {
          id: Date.now() + Math.random(),
          text: text,
          completed: false
        };
        list.push(newTask);
        saveTasks();
        return newTask;
      }

      function deleteTask(quadrant, taskId) {
        tasks['q' + quadrant] = tasks['q' + quadrant].filter(t => t.id !== taskId);
        saveTasks();
      }

      function toggleTask(quadrant, taskId) {
        const task = tasks['q' + quadrant].find(t => t.id === taskId);
        if (task) {
          task.completed = !task.completed;
          saveTasks();
        }
      }

      function updateTaskText(quadrant, taskId, newText) {
        const task = tasks['q' + quadrant].find(t => t.id === taskId);
        if (task) {
          task.text = newText;
          saveTasks();
        }
      }

      function reorderTasks(quadrant, fromIndex, toIndex) {
        const list = tasks['q' + quadrant];
        const [moved] = list.splice(fromIndex, 1);
        list.splice(toIndex, 0, moved);
        saveTasks();
      }

      function getProgress(quadrant) {
        const list = tasks['q' + quadrant];
        const total = list.length;
        const completed = list.filter(t => t.completed).length;
        return { total, completed, remaining: total - completed };
      }

      // ---------- DOM Elements ----------
      const matrixView = document.getElementById('matrixView');
      const taskListPage = document.getElementById('taskListPage');
      const plusButton = document.getElementById('plusButton');
      const matrixGrid = document.getElementById('matrixGrid');
      const backBtn = document.getElementById('backBtn');
      const addTaskBtn = document.getElementById('addTaskBtn');
      const taskItemsContainer = document.getElementById('taskItemsContainer');
      const taskListTitle = document.getElementById('taskListTitle');
      const taskCountBadge = document.getElementById('taskCountBadge');
      const splashOverlay = document.getElementById('splashOverlay');
      const darkModeToggle = document.getElementById('darkModeToggle');
      const tutorialOverlay = document.getElementById('tutorialOverlay');
      const tutorialText = document.getElementById('tutorialText');
      const tutorialStepIndicator = document.getElementById('tutorialStepIndicator');
      const tutorialNextBtn = document.getElementById('tutorialNextBtn');
      const tutorialSkipBtn = document.getElementById('tutorialSkipBtn');

      let currentQuadrant = null; // 1-4 when task list is open
      let quickAddMode = false;   // if the task list was opened via plus button drag

      // ---------- Theme ----------
      function applyDarkMode(enabled) {
        if (enabled) {
          document.body.classList.add('dark-mode');
          darkModeToggle.querySelector('svg').innerHTML = '<path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z M12 1v2 M12 21v2 M4.22 4.22l1.42 1.42 M18.36 18.36l1.42 1.42 M1 12h2 M21 12h2 M4.22 19.78l1.42-1.42 M18.36 5.64l1.42-1.42"/>';
        } else {
          document.body.classList.remove('dark-mode');
          darkModeToggle.querySelector('svg').innerHTML = '<path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>';
        }
        localStorage.setItem(DARK_MODE_KEY, enabled);
      }

      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const savedDark = localStorage.getItem(DARK_MODE_KEY);
      let darkMode = savedDark !== null ? savedDark === 'true' : prefersDark;
      applyDarkMode(darkMode);

      darkModeToggle.addEventListener('click', () => {
        darkMode = !darkMode;
        applyDarkMode(darkMode);
      });

      // ---------- Progress Rings Rendering ----------
      function renderProgressRings() {
        for (let q = 1; q <= 4; q++) {
          const container = document.getElementById('progress' + q);
          const { total, completed, remaining } = getProgress(q);
          const circumference = 2 * Math.PI * 36; // r=36
          const offset = total === 0 ? circumference : circumference * (1 - completed / total);
          container.innerHTML = `
            <svg class="progress-ring" viewBox="0 0 80 80">
              <circle class="progress-ring-bg" cx="40" cy="40" r="36"/>
              <circle class="progress-ring-fill" cx="40" cy="40" r="36"
                      stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"/>
            </svg>
            <div class="remaining-number">${remaining}</div>
            <div class="total-text">/ ${total}</div>
          `;
        }
      }

      // ---------- Task List Page Rendering ----------
      function renderTaskList(quadrant) {
        const list = getTasks(quadrant);
        taskItemsContainer.innerHTML = '';
        list.forEach((task, index) => {
          const item = document.createElement('div');
          item.className = 'task-item';
          item.draggable = true;
          item.dataset.index = index;
          item.dataset.id = task.id;

          // Drag handle
          const handle = document.createElement('div');
          handle.className = 'drag-handle';
          handle.innerHTML = '<div class="dot-row"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="dot-row"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
          item.appendChild(handle);

          // Checkbox
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'task-checkbox';
          checkbox.checked = task.completed;
          checkbox.addEventListener('change', () => {
            toggleTask(quadrant, task.id);
            renderTaskList(quadrant);
            renderProgressRings();
          });
          item.appendChild(checkbox);

          // Task text (editable on dblclick)
          const textSpan = document.createElement('span');
          textSpan.className = 'task-text' + (task.completed ? ' completed' : '');
          textSpan.textContent = task.text || 'New task';
          textSpan.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            textSpan.contentEditable = true;
            textSpan.focus();
            // Select all text
            const range = document.createRange();
            range.selectNodeContents(textSpan);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
          });
          textSpan.addEventListener('blur', () => {
            textSpan.contentEditable = false;
            const newText = textSpan.textContent.trim();
            if (newText !== task.text) {
              updateTaskText(quadrant, task.id, newText);
            }
            if (!newText) textSpan.textContent = 'New task'; // fallback
          });
          textSpan.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              textSpan.blur();
            }
          });
          item.appendChild(textSpan);

          // Drag events for reordering
          item.addEventListener('dragstart', handleDragStart);
          item.addEventListener('dragover', handleDragOver);
          item.addEventListener('dragleave', handleDragLeave);
          item.addEventListener('drop', handleDrop);
          item.addEventListener('dragend', handleDragEnd);

          taskItemsContainer.appendChild(item);
        });

        // Update badge
        const { remaining, total } = getProgress(quadrant);
        taskCountBadge.textContent = `${remaining} left of ${total}`;
      }

      // ---------- Drag & Drop (reorder tasks) ----------
      let draggedItem = null;
      let draggedIndex = null;

      function handleDragStart(e) {
        draggedItem = this;
        draggedIndex = parseInt(this.dataset.index);
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', '');
        this.classList.add('dragging');
        setTimeout(() => { this.style.opacity = '0.4'; }, 0);
      }

      function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        this.classList.add('drag-over');
      }

      function handleDragLeave(e) {
        this.classList.remove('drag-over');
      }

      function handleDrop(e) {
        e.preventDefault();
        this.classList.remove('drag-over');
        if (draggedItem !== this) {
          const fromIndex = draggedIndex;
          const toIndex = parseInt(this.dataset.index);
          reorderTasks(currentQuadrant, fromIndex, toIndex);
          renderTaskList(currentQuadrant);
          renderProgressRings();
        }
      }

      function handleDragEnd(e) {
        this.style.opacity = '1';
        document.querySelectorAll('.task-item').forEach(item => item.classList.remove('drag-over'));
        draggedItem = null;
        draggedIndex = null;
      }

      // ---------- Navigation & Splash ----------
      function playSplashAnimation(quadrantColorVar, callback) {
        const circle = document.createElement('div');
        circle.className = 'splash-circle';
        circle.style.backgroundColor = `var(${quadrantColorVar})`;
        splashOverlay.innerHTML = '';
        splashOverlay.appendChild(circle);
        splashOverlay.style.display = 'flex';
        circle.addEventListener('animationend', () => {
          splashOverlay.style.display = 'none';
          if (callback) callback();
        }, { once: true });
      }

      function openTaskList(quadrant, quickAdd = false) {
        currentQuadrant = quadrant;
        quickAddMode = quickAdd;

        // Map quadrant to color variable for splash
        const colorMap = {1: '--q1', 2: '--q2', 3: '--q3', 4: '--q4'};
        const lightColorMap = {1: '--q1-light', 2: '--q2-light', 3: '--q3-light', 4: '--q4-light'};
        const labelMap = {
          1: 'Urgent & High Priority',
          2: 'Not Urgent & High Priority',
          3: 'Urgent & Low Priority',
          4: 'Not Urgent & Low Priority'
        };

        playSplashAnimation(colorMap[quadrant], () => {
          // Set task list background
          taskListPage.style.backgroundColor = `var(${lightColorMap[quadrant]})`;
          taskListTitle.textContent = labelMap[quadrant];
          renderTaskList(quadrant);
          matrixView.style.display = 'none';
          taskListPage.classList.add('active');
          // Reset plus button position
          resetPlusButton();

          // If quick-add, automatically add a new empty task and focus
          if (quickAdd) {
            const newTask = addTask(quadrant, '');
            renderTaskList(quadrant);
            renderProgressRings();
            // Find the newly added task text and make it editable
            setTimeout(() => {
              const items = taskItemsContainer.querySelectorAll('.task-item');
              const lastItem = items[items.length - 1];
              if (lastItem) {
                const textSpan = lastItem.querySelector('.task-text');
                if (textSpan) {
                  textSpan.dblclick(); // simulate double-click to edit
                }
              }
            }, 100);
          }
        });
      }

      function closeTaskList() {
        taskListPage.classList.remove('active');
        matrixView.style.display = '';
        currentQuadrant = null;
        quickAddMode = false;
        renderProgressRings();
      }

      function resetPlusButton() {
        plusButton.style.transform = 'translate(-50%, -50%)';
        plusButton.classList.remove('dragging');
      }

      // Quadrant click events
      document.querySelectorAll('.quadrant').forEach(q => {
        q.addEventListener('click', (e) => {
          // Ignore if plus button drag just ended on it (handled separately)
          if (e.target.closest('.plus-button')) return;
          const qNum = parseInt(q.dataset.quadrant);
          openTaskList(qNum, false);
        });
      });

      backBtn.addEventListener('click', closeTaskList);

      addTaskBtn.addEventListener('click', () => {
        if (currentQuadrant) {
          addTask(currentQuadrant, '');
          renderTaskList(currentQuadrant);
          renderProgressRings();
          // Focus on the new task
          const items = taskItemsContainer.querySelectorAll('.task-item');
          const lastItem = items[items.length - 1];
          if (lastItem) {
            const textSpan = lastItem.querySelector('.task-text');
            if (textSpan) textSpan.dblclick();
          }
        }
      });

      // ---------- Plus Button Dragging ----------
      let isDraggingPlus = false;
      let startX, startY, initialLeft, initialTop;

      plusButton.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        e.preventDefault();
        isDraggingPlus = true;
        plusButton.setPointerCapture(e.pointerId);
        const rect = plusButton.getBoundingClientRect();
        startX = e.clientX;
        startY = e.clientY;
        initialLeft = rect.left + rect.width/2;
        initialTop = rect.top + rect.height/2;
        plusButton.classList.add('dragging');
      });

      plusButton.addEventListener('pointermove', (e) => {
        if (!isDraggingPlus) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        plusButton.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      });

      plusButton.addEventListener('pointerup', (e) => {
        if (!isDraggingPlus) return;
        isDraggingPlus = false;
        plusButton.classList.remove('dragging');
        plusButton.releasePointerCapture(e.pointerId);

        // Determine which quadrant we ended in
        const gridRect = matrixGrid.getBoundingClientRect();
        const centerX = gridRect.left + gridRect.width/2;
        const centerY = gridRect.top + gridRect.height/2;
        const btnRect = plusButton.getBoundingClientRect();
        const btnCenterX = btnRect.left + btnRect.width/2;
        const btnCenterY = btnRect.top + btnRect.height/2;

        let quadrant = null;
        if (btnCenterX < centerX && btnCenterY < centerY) quadrant = 1; // top-left
        else if (btnCenterX >= centerX && btnCenterY < centerY) quadrant = 2; // top-right
        else if (btnCenterX < centerX && btnCenterY >= centerY) quadrant = 3; // bottom-left
        else if (btnCenterX >= centerX && btnCenterY >= centerY) quadrant = 4; // bottom-right

        if (quadrant) {
          // Open in quick-add mode
          openTaskList(quadrant, true);
        } else {
          resetPlusButton();
        }
      });

      // Prevent click after drag
      plusButton.addEventListener('click', (e) => {
        if (isDraggingPlus || plusButton.classList.contains('dragging')) {
          e.stopPropagation();
          e.preventDefault();
        }
      });

      // ---------- Tutorial ----------
      const tutorialSteps = [
        {
          text: "Welcome to Habita! This is your Eisenhower Matrix – four quadrants to prioritise tasks.",
          element: null, // full overlay
        },
        {
          text: "Drag the + button into a quadrant to quickly add a task.",
          element: plusButton,
          position: 'center'
        },
        {
          text: "Or tap any quadrant to view and manage its task list.",
          element: document.querySelector('.q1'),
          position: 'top-left'
        },
        {
          text: "Inside, check off completed tasks, reorder by dragging the 6-dot grip, and double-click to edit.",
          element: null, // will show task list later
        },
        {
          text: "The number in each quadrant shows how many tasks remain. Try to clear them all!",
          element: document.getElementById('progress1'),
          position: 'top-left'
        },
        {
          text: "Switch between light and dark mode anytime with the button in the top-right corner.",
          element: darkModeToggle,
          position: 'top-right'
        }
      ];

      let currentTutorialStep = 0;

      function showTutorialStep(stepIndex) {
        if (stepIndex >= tutorialSteps.length) {
          endTutorial();
          return;
        }
        const step = tutorialSteps[stepIndex];
        tutorialText.textContent = step.text;
        tutorialStepIndicator.textContent = `Step ${stepIndex + 1} of ${tutorialSteps.length}`;
        tutorialOverlay.classList.add('active');

        // For step 3 (task list), we could simulate opening a quadrant, but for simplicity we'll just show text.
        // We'll highlight the element if provided, otherwise just center box.
        const box = document.getElementById('tutorialBox');
        box.style.position = 'relative';
        // Remove old arrows
        box.querySelectorAll('.arrow-dot').forEach(el => el.remove());

        if (step.element && step.position) {
          const elRect = step.element.getBoundingClientRect();
          const boxRect = box.getBoundingClientRect();
          // Place the box near the element (simplified)
          // Actually we'll keep the box centered for clarity, but add an arrow pointing toward the element.
          // For brevity, we'll just center the box and maybe add a small arrow via CSS.
          // The original design: dotted arrows guide. We'll just use text + highlighting.
          // We'll add a visual highlight to the target element.
        }

        currentTutorialStep = stepIndex;
      }

      function endTutorial() {
        tutorialOverlay.classList.remove('active');
        localStorage.setItem(TUTORIAL_KEY, 'true');
        currentTutorialStep = 0;
      }

      tutorialNextBtn.addEventListener('click', () => {
        showTutorialStep(currentTutorialStep + 1);
      });

      tutorialSkipBtn.addEventListener('click', endTutorial);

      // Start tutorial if first time
      if (!localStorage.getItem(TUTORIAL_KEY)) {
        showTutorialStep(0);
      }

      // ---------- Initial Render ----------
      renderProgressRings();

      // Expose for potential external use
      window.habita = { getTasks, addTask, renderProgressRings, renderTaskList };
    })();
  </script>
</body>
</html>
